name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Nothing gated publishing on the test suite before this - build:verify
      # only checks that the server starts and registers its tools.
      # `npm test` is vitest in watch mode; test:run is the single-pass variant.
      - name: Run test suite
        run: npm run test:run

      - name: Build and verify
        run: npm run build:verify

      - name: Publish
        run: npm publish --provenance --ignore-scripts
