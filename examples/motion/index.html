<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #f4f4f6; color: #222; }
  header { display: flex; gap: 8px; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; }
  header h1 { font-size: 17px; margin: 0 auto 0 0; }
  button { font: inherit; padding: 6px 12px; border: 1px solid #bbb; border-radius: 6px; background: #fff; cursor: pointer; }
  #count { position: relative; }
  #badge { position: absolute; top: -8px; right: -8px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
    background: #d33; color: #fff; font-size: 12px; line-height: 20px; text-align: center; }
  #badge.pop { animation: pop 300ms ease-out; }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    55% { transform: scale(0.6); }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  main { padding: 16px; max-width: 560px; }
  .row { display: flex; align-items: center; height: 48px; padding: 0 12px; margin-bottom: 6px; background: #fff;
    border-radius: 6px; overflow: hidden; transition: height 250ms ease, margin 250ms ease, opacity 250ms ease; }
  .row.removing { height: 0; margin-bottom: 0; opacity: 0; transition: none; }

  #backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity 300ms linear; }
  #backdrop.open { opacity: 1; pointer-events: auto; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 240px; background: #fff; padding: 16px;
    transform: translateX(100%); box-shadow: -4px 0 16px rgba(0,0,0,.15);
    transition: transform 420ms cubic-bezier(.2,.8,.2,1), width 420ms cubic-bezier(.2,.8,.2,1); }
  #panel.open { transform: translateX(0); width: 320px; }
  #panel h2 { font-size: 15px; margin: 0 0 12px; }
  .item { padding: 10px; margin-bottom: 6px; background: #eef; border-radius: 6px; opacity: 0; transform: translateY(16px);
    transition: transform 300ms ease-out, opacity 300ms ease-out; }
  #panel.open .item { opacity: 1; transform: translateY(0); }
  #panel.open .item:nth-child(2) { transition-delay: 0ms; }
  #panel.open .item:nth-child(3) { transition-delay: 40ms; }
  #panel.open .item:nth-child(4) { transition-delay: 80ms; transition-timing-function: ease-in; }
  #panel.open .item:nth-child(5) { transition-delay: 120ms; }
  #panel.open .item:nth-child(6) { transition-delay: 260ms; }

  #toast { position: fixed; left: 50%; bottom: 24px; padding: 10px 16px; border-radius: 6px; background: #222; color: #fff;
    transform: translateX(-50%); opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>Inbox</h1>
  <button id="count">New mail<span id="badge">3</span></button>
  <button id="save">Save</button>
  <button id="open">Folders</button>
</header>
<main id="list">
  <div class="row">Quarterly numbers <button class="remove">Remove</button></div>
  <div class="row">Lunch on Friday? <button class="remove">Remove</button></div>
  <div class="row">Build passed <button class="remove">Remove</button></div>
  <div class="row">Re: the motion bug <button class="remove">Remove</button></div>
</main>
<div id="backdrop"></div>
<aside id="panel">
  <h2>Folders</h2>
  <div class="item">Inbox</div>
  <div class="item">Starred</div>
  <div class="item">Sent</div>
  <div class="item">Drafts</div>
  <div class="item">Archive</div>
</aside>
<div id="toast">Saved</div>
<script>
  const $ = id => document.getElementById(id);
  const panel = $('panel'), backdrop = $('backdrop'), toast = $('toast'), badge = $('badge');

  const togglePanel = () => {
    const open = !panel.classList.contains('open');
    panel.classList.toggle('open', open);
    backdrop.classList.toggle('open', open);
  };
  $('open').addEventListener('click', togglePanel);
  backdrop.addEventListener('click', togglePanel);

  $('count').addEventListener('click', () => {
    badge.textContent = String(Number(badge.textContent) + 1);
    badge.classList.remove('pop');
    void badge.offsetWidth;
    badge.classList.add('pop');
  });

  let dismiss;
  $('save').addEventListener('click', () => {
    clearTimeout(dismiss);
    toast.style.transition = 'none';
    toast.style.opacity = '1';
    requestAnimationFrame(() => {
      toast.style.opacity = '0';
      requestAnimationFrame(() => {
        toast.style.transition = 'opacity 1000ms ease-out';
        toast.style.opacity = '1';
        dismiss = setTimeout(() => { toast.style.opacity = '0'; }, 700);
      });
    });
  });

  $('list').addEventListener('click', e => {
    if (!e.target.classList.contains('remove')) return;
    const row = e.target.closest('.row');
    row.classList.add('removing');
    setTimeout(() => row.remove(), 250);
  });

  document.addEventListener('keydown', e => {
    if (e.key === '1') $('count').click();
    if (e.key === '2') $('save').click();
    if (e.key === '3') togglePanel();
    if (e.key === '4') document.querySelector('.row .remove')?.click();
  });
</script>
</body>
</html>
