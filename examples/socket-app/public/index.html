<!doctype html>
<meta charset="utf-8">
<title>socket-app</title>
<style>
  body { font: 14px -apple-system, system-ui, sans-serif; margin: 24px; max-width: 900px; }
  h1 { font-size: 16px; text-transform: uppercase; letter-spacing: .6px; color: #666; }
  fieldset { border: 1px solid #ddd; border-radius: 8px; margin: 0 0 14px; padding: 12px 14px; }
  legend { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #888; }
  button { font: inherit; padding: 5px 10px; margin: 0 6px 6px 0; border: 1px solid #ccc;
           border-radius: 6px; background: #fff; cursor: pointer; }
  button:hover { border-color: #1a73e8; color: #1a73e8; }
  #log { font: 12px/1.6 ui-monospace, Menlo, monospace; background: #f6f6f6; border-radius: 6px;
         padding: 10px; height: 260px; overflow: auto; white-space: pre-wrap; }
  #count { font-weight: 600; }
</style>

<h1>socket-app</h1>
<p>Open sockets, then read them with
  <code>network({ action: 'sockets', frames: true, socketUrl: '7788' })</code>.</p>

<fieldset>
  <legend>payload shapes</legend>
  <button data-testid="open-small" data-path="/small">small text, 2/s</button>
  <button data-testid="open-big" data-path="/big?chars=200000">200KB text frames</button>
  <button data-testid="open-binary" data-path="/binary?bytes=3000">binary frames</button>
  <button data-testid="open-burst" data-path="/burst?n=300">burst of 300</button>
</fieldset>

<fieldset>
  <legend>lifecycle</legend>
  <button data-testid="open-ping" data-path="/ping">server protocol pings</button>
  <button data-testid="open-heartbeat" data-path="/heartbeat">app heartbeat, 0.5/s</button>
  <button data-testid="open-quiet" data-path="/quiet">silent socket</button>
  <button data-testid="open-serverclose" data-path="/serverclose">server closes it</button>
  <button data-testid="open-badframe" data-path="/badframe">provoke a frame error</button>
</fieldset>

<fieldset>
  <legend>from the page</legend>
  <button data-testid="send-frame">send a text frame</button>
  <button data-testid="send-binary">send a binary frame</button>
  <button data-testid="client-close">close from the page</button>
</fieldset>

<fieldset>
  <legend>ingress that is not a socket</legend>
  <button data-testid="open-sse">open an SSE stream</button>
  <button data-testid="close-sse">close it</button>
</fieldset>

<fieldset>
  <legend>egress that never reaches the network</legend>
  <button data-testid="write-local">write localStorage</button>
  <button data-testid="write-session">write sessionStorage</button>
  <button data-testid="write-cookie">write a cookie</button>
  <button data-testid="write-idb">write IndexedDB</button>
  <button data-testid="save-draft">write a draft, then POST it</button>
</fieldset>

<fieldset>
  <legend>scale and targets</legend>
  <button data-testid="open-sixty">open 60 sockets</button>
  <button data-testid="open-worker">open one from a worker</button>
  <button data-testid="navigate-away">navigate with sockets open</button>
  <button data-testid="close-all">close all</button>
</fieldset>

<p>open sockets: <span id="count" data-testid="socket-count">0</span></p>
<div id="log" data-testid="log"></div>

<script>
const sockets = [];
let worker = null;
const $ = (sel) => document.querySelector(sel);
const log = (line) => {
  const el = $('#log');
  el.textContent += line + '\n';
  el.scrollTop = el.scrollHeight;
};
const refresh = () => {
  $('#count').textContent = sockets.filter(s => s.readyState === WebSocket.OPEN).length;
};

function open(path, quiet) {
  const ws = new WebSocket(`ws://${location.host}${path}`);
  ws.binaryType = 'arraybuffer';
  ws.addEventListener('open', () => { if (!quiet) log(`open  ${path}`); refresh(); });
  ws.addEventListener('close', (e) => { if (!quiet) log(`close ${path} code=${e.code}`); refresh(); });
  ws.addEventListener('error', () => { if (!quiet) log(`error ${path}`); refresh(); });
  let seen = 0;
  ws.addEventListener('message', (e) => {
    seen++;
    if (quiet) return;
    const size = typeof e.data === 'string' ? e.data.length : e.data.byteLength;
    if (seen <= 3 || seen % 100 === 0) log(`recv  ${path} #${seen} ${size}b`);
  });
  sockets.push(ws);
  return ws;
}

const live = () => sockets.filter(s => s.readyState === WebSocket.OPEN);

for (const button of document.querySelectorAll('button[data-path]')) {
  button.addEventListener('click', () => open(button.dataset.path));
}

$('[data-testid=send-frame]').addEventListener('click', () => {
  const target = live()[0];
  if (!target) return log('no open socket to send on');
  target.send(JSON.stringify({ from: 'page', at: Date.now() }));
  log('sent  text frame');
});

$('[data-testid=send-binary]').addEventListener('click', () => {
  const target = live()[0];
  if (!target) return log('no open socket to send on');
  target.send(new Uint8Array([1, 2, 3, 4, 5, 6, 7, 8]));
  log('sent  binary frame');
});

$('[data-testid=client-close]').addEventListener('click', () => {
  const target = live()[0];
  if (!target) return log('no open socket to close');
  target.close(1000, 'page hung up');
  log('sent  close frame');
});

$('[data-testid=open-sixty]').addEventListener('click', () => {
  for (let i = 0; i < 60; i++) open(`/quiet?n=${i}`, true);
  log('opened 60 quiet sockets');
});

$('[data-testid=open-worker]').addEventListener('click', () => {
  worker = new Worker('/socket-worker.js');
  worker.addEventListener('message', (e) => log(`worker ${e.data}`));
  worker.postMessage(`ws://${location.host}/small?ms=800`);
  log('worker started');
});

$('[data-testid=navigate-away]').addEventListener('click', () => {
  log('navigating with ' + live().length + ' socket(s) open');
  location.href = '/second.html';
});

let sse = null;
$('[data-testid=open-sse]').addEventListener('click', () => {
  if (sse) return log('sse already open');
  sse = new EventSource('/sse?ms=1000');
  sse.addEventListener('open', () => log('sse   open'));
  sse.addEventListener('message', (e) => log(`sse   message ${e.data.replace(/\n/g, ' ')}`));
  sse.addEventListener('price', (e) => log(`sse   price   ${e.data}`));
  sse.addEventListener('error', () => log('sse   error'));
});

$('[data-testid=close-sse]').addEventListener('click', () => {
  if (!sse) return log('no sse stream open');
  sse.close();
  sse = null;
  log('sse   closed by the page');
});

// Each of these leaves the page and reaches nothing on the network, so the
// only record of them is whatever the debugger can see the page do.
$('[data-testid=write-local]').addEventListener('click', () => {
  localStorage.setItem('socket-app:draft', JSON.stringify({ at: Date.now(), body: 'unsent' }));
  log('wrote localStorage socket-app:draft');
});

$('[data-testid=write-session]').addEventListener('click', () => {
  sessionStorage.setItem('socket-app:step', String(Date.now()));
  log('wrote sessionStorage socket-app:step');
});

$('[data-testid=write-cookie]').addEventListener('click', () => {
  document.cookie = `socket-app-seen=${Date.now()}; path=/; SameSite=Lax`;
  log('wrote cookie socket-app-seen');
});

$('[data-testid=write-idb]').addEventListener('click', () => {
  const open = indexedDB.open('socket-app', 1);
  open.addEventListener('upgradeneeded', () => open.result.createObjectStore('drafts', { keyPath: 'id' }));
  open.addEventListener('success', () => {
    const tx = open.result.transaction('drafts', 'readwrite');
    tx.objectStore('drafts').put({ id: 'draft-1', body: 'unsent', at: Date.now() });
    tx.addEventListener('complete', () => log('wrote IndexedDB socket-app/drafts/draft-1'));
  });
});

// The pair that separates the two cases: the same record written locally, then
// sent. One click produces a boundary crossing, the other produces none.
$('[data-testid=save-draft]').addEventListener('click', async () => {
  const draft = { id: 'draft-1', body: 'sent', at: Date.now() };
  localStorage.setItem('socket-app:draft', JSON.stringify(draft));
  log('wrote localStorage, now posting');
  const res = await fetch('/draft', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(draft),
  });
  log(`POST /draft -> ${res.status}`);
});

$('[data-testid=close-all]').addEventListener('click', () => {
  if (sse) { sse.close(); sse = null; }
  for (const s of sockets) { try { s.close(); } catch {} }
  if (worker) { worker.terminate(); worker = null; }
  log('closed all');
  refresh();
});
</script>
